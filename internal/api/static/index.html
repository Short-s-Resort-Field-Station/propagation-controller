<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Propagation Unit 01</title>
<style>
  :root {
    --bg: #0e1116; --panel: #161b22; --border: #262d38;
    --text: #d4dae3; --dim: #7a8494; --accent: #4c9e6c;
    --on: #4c9e6c; --off: #444c59; --err: #c05252; --warn: #c0a052;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 24px; border-bottom: 1px solid var(--border); background: var(--panel); }
  header h1 { font-size: 16px; font-weight: 600; letter-spacing: .3px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--err); }
  .dot.ok { background: var(--on); }
  .dot.degraded { background: var(--warn); }
  .badge { font-size: 11px; color: var(--dim); border: 1px solid var(--border); padding: 2px 8px; border-radius: 10px; }
  .spacer { flex: 1; }
  main { max-width: 1080px; margin: 0 auto; padding: 24px; display: grid; gap: 20px; }
  section { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 18px 20px; }
  section h2 { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--dim); margin-bottom: 14px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .tile { border: 1px solid var(--border); border-radius: 6px; padding: 12px 14px; }
  .tile .k { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .5px; }
  .tile .v { font-size: 20px; font-weight: 600; margin-top: 4px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  th { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .5px; font-weight: 600; }
  .state { display: inline-block; min-width: 42px; text-align: center; font-size: 11px; font-weight: 700; text-transform: uppercase; border-radius: 4px; padding: 2px 8px; }
  .state.on { background: rgba(76,158,108,.18); color: var(--on); }
  .state.off { background: rgba(68,76,89,.3); color: var(--dim); }
  .state.unknown, .state.error { background: rgba(192,82,82,.15); color: var(--err); }
  button { background: #1e2631; color: var(--text); border: 1px solid var(--border); border-radius: 5px; padding: 5px 12px; font-size: 12px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.danger { border-color: var(--err); color: var(--err); }
  .events li { list-style: none; padding: 6px 0; border-bottom: 1px solid var(--border); display: flex; gap: 12px; font-size: 13px; }
  .events li:last-child { border-bottom: 0; }
  .events time { color: var(--dim); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .events .lvl-error { color: var(--err); }
  .events .lvl-warning { color: var(--warn); }
  .muted { color: var(--dim); font-size: 12px; }
</style>
</head>
<body>
<header>
  <span class="dot" id="statusDot"></span>
  <h1>Propagation Unit 01</h1>
  <span class="badge" id="simBadge" hidden>SIMULATION</span>
  <div class="spacer"></div>
  <span class="muted" id="clock"></span>
  <button class="danger" id="estopBtn" onclick="toggleEstop()">EMERGENCY STOP</button>
</header>
<main>
  <section>
    <h2>System Status</h2>
    <div class="tiles" id="tiles"></div>
  </section>
  <section>
    <h2>Sensors</h2>
    <div class="tiles" id="sensorTiles"></div>
    <p class="muted" style="margin-top:10px" id="busInfo"></p>
  </section>
  <section>
    <h2>Irrigation</h2>
    <p class="muted" id="engineStatus" style="margin-bottom:10px"></p>
    <table>
      <thead><tr><th>Zone</th><th>Name</th><th>Moisture</th><th>Last Run</th><th>State</th><th style="width:230px">Control</th></tr></thead>
      <tbody id="zoneRows"></tbody>
    </table>
  </section>
  <section>
    <h2>Relays</h2>
    <table>
      <thead><tr><th>Ch</th><th>Device</th><th>State</th><th style="width:220px">Control</th></tr></thead>
      <tbody id="relayRows"></tbody>
    </table>
    <p style="margin-top:12px"><button class="danger" onclick="allOff()">All Relays Off</button>
       <span class="muted">Pump commands are sent with a bounded timeout — it turns itself off server-side.</span></p>
  </section>
  <section>
    <h2>Recent Events</h2>
    <ul class="events" id="events"></ul>
  </section>
</main>
<script>
const PUMP_CHANNEL = 2;
const $ = id => document.getElementById(id);

async function api(path, opts) {
  const res = await fetch('/api/v1' + path, opts);
  if (!res.ok) throw new Error((await res.json()).error || res.statusText);
  return res.json();
}

async function setRelay(channel, state, timeout) {
  try {
    await api(`/relays/${channel}/set`, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({state, actor: 'manual_web', reason: 'web dashboard', timeout_seconds: timeout || 0})
    });
  } catch (e) { alert('Relay command failed: ' + e.message); }
  refresh();
}

async function allOff() {
  try { await api('/relays/all-off', {method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({actor: 'manual_web', reason: 'web dashboard all-off'})}); }
  catch (e) { alert('All-off failed: ' + e.message); }
  refresh();
}

function controlsFor(r) {
  if (r.channel === PUMP_CHANNEL) {
    return `<button onclick="setRelay(2,'on',10)">Run 10s</button>
            <button onclick="setRelay(2,'on',30)">Run 30s</button>
            <button onclick="setRelay(2,'off')">Off</button>`;
  }
  return `<button onclick="setRelay(${r.channel},'on')">On</button>
          <button onclick="setRelay(${r.channel},'off')">Off</button>`;
}

function fmtUptime(s) {
  if (s < 60) return `${s}s`;
  if (s < 3600) return `${Math.floor(s/60)}m`;
  if (s < 86400) return `${Math.floor(s/3600)}h ${Math.floor(s%3600/60)}m`;
  return `${Math.floor(s/86400)}d ${Math.floor(s%86400/3600)}h`;
}

let estopActive = false;
async function toggleEstop() {
  try {
    if (estopActive) {
      await api('/safety/reset', {method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({actor: 'manual_web'})});
    } else {
      if (!confirm('EMERGENCY STOP: pump and all valves will be forced off and automation paused. Continue?')) return;
      await api('/safety/emergency-stop', {method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({actor: 'manual_web', reason: 'web dashboard emergency stop'})});
    }
  } catch (e) { alert(e.message); }
  refresh();
}

async function runZone(key, seconds) {
  try {
    await api(`/irrigation/zones/${key}/run`, {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({duration_seconds: seconds, actor: 'manual_web', reason: 'web dashboard'})});
  } catch (e) { alert('Run failed: ' + e.message); }
  refresh();
}
async function stopZone(key) {
  try { await api(`/irrigation/zones/${key}/stop`, {method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({actor: 'manual_web'})}); }
  catch (e) { alert('Stop failed: ' + e.message); }
  refresh();
}

function relTime(iso) {
  if (!iso) return 'Never';
  const mins = Math.floor((Date.now() - new Date(iso)) / 60000);
  if (mins < 1) return 'Just now';
  if (mins < 60) return `${mins}m ago`;
  if (mins < 1440) return `${Math.floor(mins/60)}h ago`;
  return `${Math.floor(mins/1440)}d ago`;
}

async function refresh() {
  try {
    const h = await api('/health');
    $('statusDot').className = 'dot ' + (h.status === 'ok' ? 'ok' : 'degraded');
    $('simBadge').hidden = !h.simulation;
    const sf = await api('/safety/status');
    estopActive = sf.emergency_stop.active;
    const btn = $('estopBtn');
    btn.textContent = estopActive ? 'RESET E-STOP' : 'EMERGENCY STOP';
    let safetyVal = 'OK';
    if (estopActive) safetyVal = 'E-STOP';
    else if (sf.lockouts.length) safetyVal = sf.lockouts.map(l => l.key).join(', ');

    $('tiles').innerHTML = [
      ['Status', h.status], ['Version', h.version],
      ['Uptime', fmtUptime(h.uptime_seconds)], ['Database', h.database],
      ['Relay Controller', h.relay_controller], ['Modbus Bus', h.modbus_bus.replace('_', ' ')],
      ['Safety', safetyVal],
    ].map(([k, v]) => `<div class="tile"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('');

    const sn = await api('/sensors');
    const tiles = [];
    for (const dev of sn.sensors) {
      for (const m of dev.measurements) {
        const val = m.value == null ? '—' : `${m.value.toFixed(1)}${m.unit}`;
        tiles.push(`<div class="tile"><div class="k">${dev.name} · ${m.name}</div>
          <div class="v">${val}</div>
          <div class="muted">${dev.status}${m.read_at ? ' · ' + new Date(m.read_at).toLocaleTimeString() : ''}</div></div>`);
      }
    }
    $('sensorTiles').innerHTML = tiles.join('') || '<span class="muted">No sensors configured</span>';
    $('busInfo').textContent = `Modbus bus: ${sn.bus.status}` +
      (sn.bus.info && sn.bus.info.port ? ` · ${sn.bus.info.port} @ ${sn.bus.info.baud}` : '');

    const ir = await api('/irrigation/zones');
    const eng = ir.engine;
    let engText = 'Idle — no active cycle';
    if (eng.active_cycle) engText = `Active: ${eng.active_cycle.zone_key} (${eng.active_cycle.state}, ${eng.active_cycle.duration_seconds}s)`;
    if (eng.queue.length) engText += ` · Queued: ${eng.queue.map(q => q.zone_key).join(' → ')}`;
    $('engineStatus').textContent = engText;
    $('zoneRows').innerHTML = ir.zones.map(z => {
      const moisture = z.latest ? `${z.latest.moisture.toFixed(1)}%` : '—';
      const last = z.last_cycle ? `${relTime(z.last_cycle.started_at)} (${z.last_cycle.result})` : 'Never';
      const controls = z.state === 'disabled' ? '<span class="muted">disabled</span>' :
        (z.state === 'running' || z.state === 'queued')
          ? `<button class="danger" onclick="stopZone('${z.zone_key}')">Stop</button>`
          : `<button onclick="runZone('${z.zone_key}',60)">Run 1m</button>
             <button onclick="runZone('${z.zone_key}',180)">Run 3m</button>`;
      return `<tr><td>${z.zone_key.replace('zone_','')}</td><td>${z.name}</td><td>${moisture}</td>
        <td>${last}</td><td><span class="state ${z.state === 'running' ? 'on' : 'off'}">${z.state}</span></td>
        <td>${controls}</td></tr>`;
    }).join('');

    const rl = await api('/relays');
    $('relayRows').innerHTML = rl.relays.map(r =>
      `<tr><td>${r.channel}</td><td>${r.name}</td>
       <td><span class="state ${r.state}">${r.state}</span></td>
       <td>${controlsFor(r)}</td></tr>`).join('');

    const ev = await api('/events?limit=15');
    $('events').innerHTML = ev.events.map(e =>
      `<li><time>${new Date(e.occurred_at).toLocaleTimeString()}</time>
       <span class="lvl-${e.level}">${e.message}</span>
       <span class="muted">${e.actor || ''}</span></li>`).join('') || '<li class="muted">No events yet</li>';
  } catch (e) {
    $('statusDot').className = 'dot';
  }
  $('clock').textContent = new Date().toLocaleString();
}

refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
