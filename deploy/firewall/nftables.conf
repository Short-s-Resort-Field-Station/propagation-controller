#!/usr/sbin/nft -f
# Propagation Unit 01 host firewall.
# 2026-11-10: SSH and the dashboard from Austin's two LAN subnets while the
#             bring-up needed a direct address.
# 2026-11-15: TUNNEL-ONLY (Austin: "the tunnel only firewall is probably worth
#             doing"). Inbound is SSH from the LAN and nothing else. The
#             dashboard is reached through the Cloudflare tunnel, which is an
#             outbound connection from cloudflared on this box to
#             http://localhost:80, and by the kiosk, also on localhost — so
#             port 80 never needs to be open to the LAN. Outbound unrestricted
#             (tunnel, NTP, apt, Web Push to the browsers' push services).
# Apply:  sudo nft -f /etc/nftables.conf   (nftables.service loads it at boot)
flush ruleset
table inet filter {
  chain input {
    type filter hook input priority 0; policy drop;
    iif "lo" accept
    ct state established,related accept
    ct state invalid drop
    ip protocol icmp accept
    ip6 nexthdr icmpv6 accept
    ip saddr { 192.168.1.0/24, 192.168.5.0/24 } tcp dport 22 accept
  }
  chain forward { type filter hook forward priority 0; policy drop; }
  chain output  { type filter hook output  priority 0; policy accept; }
}
