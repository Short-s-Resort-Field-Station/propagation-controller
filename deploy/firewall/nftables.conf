#!/usr/sbin/nft -f
# Propagation Unit 01 host firewall (2026-11-10). Inbound: only SSH and the
# dashboard from Austin's two LAN subnets; everything else dropped. Outbound
# unrestricted (Cloudflare tunnel, NTP, apt). When troubleshooting is over,
# drop the 22/80 rule to tunnel-only access (the tunnel is outbound, so the
# dashboard keeps working at shortsfieldstation.org/propagate).
flush ruleset
table inet filter {
  chain input {
    type filter hook input priority 0; policy drop;
    iif "lo" accept
    ct state established,related accept
    ct state invalid drop
    ip protocol icmp accept
    ip6 nexthdr icmpv6 accept
    ip saddr { 192.168.1.0/24, 192.168.5.0/24 } tcp dport { 22, 80 } accept
  }
  chain forward { type filter hook forward priority 0; policy drop; }
  chain output  { type filter hook output  priority 0; policy accept; }
}
